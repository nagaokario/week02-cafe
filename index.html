<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE カフェメニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-amber-50 text-neutral-800">
    <header class="bg-amber-50 text-amber-900 text-white text-center py-4 shadow-md">
      <h1 class="text-lg font-bold text-gray-500">POSSE Cafe</h1>
    </header>


    <main class="max-w-5xl mx-auto px-8 py-10">
      <section><h1 class="text-2xl font-bold text-stone-900 border-b-2 border-amber-600 pb-2 mb-6">MENU</h1></section>



      <section class="mb-12">
        <h3 class="text-2xl font-bold text-amber-950 mb-6 flex items-center gap-2">
          <span class="w-2 h-6 bg-amber-600 rounded-full"></span>
          FOODS
        </h3>
            
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-white rounded-lg shadow p-6 transform hover:-translate-y-1 hover:shadow-lg transition-all duration-300 flex flex-col justify-between">
            <div>
            <h4 class="text-lg font-bold text-neutral-900 mb-2">オムライス</h4>
            <p class="text-sm text-neutral-500 mb-4">おいしいオムライス</p>
            </div>
          <div class="text-right">
          <span class="text-lg font-semibold text-amber-700">¥700</span>
          </div>
          <button class="bg-yellow-500 text-white px-4 py-1 rounded hover:bg-yellow-600">注文する</button>
          </div>
        </div>
      </section>


      <section class="mb-12">
        <h3 class="text-2xl font-bold text-amber-950 mb-6 flex items-center gap-2">
          <span class="w-2 h-6 bg-amber-600 rounded-full"></span>
          DRINKS
        </h3>
            
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-white rounded-lg shadow p-6 transform hover:-translate-y-1 hover:shadow-lg transition-all duration-300 flex flex-col justify-between">
            <div>
            <h4 class="text-lg font-bold text-neutral-900 mb-2">アイスコーヒー</h4>
            <p class="text-sm text-neutral-500 mb-4">おいしいアイスコーヒー</p>
            </div>
          <div class="text-right">
          <span class="text-lg font-semibold text-amber-700">¥450</span>
          </div>
          <button class="bg-yellow-500 text-white px-4 py-1 rounded hover:bg-yellow-600">注文する</button>
        </div>
      </section>


      <section class="mb-12">
        <h3 class="text-2xl font-bold text-amber-950 mb-6 flex items-center gap-2">
            <span class="w-2 h-6 bg-amber-600 rounded-full"></span>
            SWEETS
        </h3>
            
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-lg shadow p-6 transform hover:-translate-y-1 hover:shadow-lg transition-all duration-300 flex flex-col justify-between">
              <div>
              <h4 class="text-lg font-bold text-neutral-900 mb-2">プリン</h4>
              <p class="text-sm text-neutral-500 mb-4">おいしいプリン</p>
              </div>
            <div class="text-right">
            <span class="text-lg font-semibold text-amber-700">¥550</span>
            </div>
            <button class="bg-yellow-500 text-white px-4 py-1 rounded hover:bg-yellow-600">注文する</button>
          </div>
    </main>


    <footer class="bg-amber-50 text-amber-900 text-white text-center pt-4 shadow-md">
      <div class="bg-amber-50 text-center py-6 text-gray-500 text-sm">
        <p>2026 POSSE Cafe</p>
      </div>
    </footer>
  </body>
</html>
